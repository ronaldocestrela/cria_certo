services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: criacerto-db
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
    volumes:
      - mssql-criacerto:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criacerto-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: criacerto-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-criacerto:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criacerto-network
    restart: always

  api:
    build:
      context: .
      dockerfile: src/Host/CriaCerto.Api/Dockerfile
    container_name: criacerto-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=${DB_HOST:-database},${DB_PORT_API:-1433};Database=${DATABASE_NAME:-criacerto_foundation};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-database},${DB_PORT_API:-1433};Database=${DATABASE_NAME:-criacerto_foundation};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET:-CriaCertoProductionSecureJwtKey2026!32Bytes}"
      Jwt__SecretKey: "${JWT_SECRET:-CriaCertoProductionSecureJwtKey2026!32Bytes}"
      JwtSettings__Issuer: "CriaCerto.Api"
      JwtSettings__Audience: "CriaCerto.Client"
      Jwt__Issuer: "CriaCerto.Api"
      Jwt__Audience: "CriaCerto.Client"
      Cors__AllowedOrigins__0: "http://localhost:8081"
      Cors__AllowedOrigins__1: "http://localhost:8080"
      Cors__AllowedOrigins__2: "http://localhost:5000"
      Cors__AllowedOrigins__3: "http://localhost:5001"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-dp-keys:/app/dataprotection-keys
    networks:
      - criacerto-network
    restart: always

  web:
    build:
      context: .
      dockerfile: src/Web/CriaCerto.Web/CriaCerto.Web/Dockerfile
    container_name: criacerto-web
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: "http://api:8080"
    depends_on:
      - api
    volumes:
      - web-dp-keys:/app/dataprotection-keys
    networks:
      - criacerto-network
    restart: always

volumes:
  mssql-criacerto:
    driver: local
  redis-criacerto:
    driver: local
  api-dp-keys:
    driver: local
  web-dp-keys:
    driver: local

networks:
  criacerto-network:
    driver: bridge
